[project]
name = "haptica-transcriptions"
version = "0.1.0"
description = "Egocentric GoPro capture pipeline tooling."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "bleak>=0.22",
  "flask>=3.0",
  "imageio-ffmpeg>=0.4.9",
  "google-api-python-client>=2.120.0",
  "google-auth>=2.28.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.0",
  "httpx>=0.27",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "protobuf>=4.25",
  "pyobjc-framework-Vision>=10.0",
  "pyyaml>=6.0",
  "qrcode[pil]>=7.4",
  "rich>=14.2.0",
  "zeroconf>=0.148.0",
]

[project.scripts]
gopro = "gopro.cli:main"
transcriptions = "recording.cli:main"
transcriptions-web = "web.server:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dummy_camera", "gopro", "gopro.ble_proto", "recording", "web"]
